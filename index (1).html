.orb, .orb * { box-sizing: border-box; }
.orb {
  --void:#070B1A; --deep:#0E1430; --panel:rgba(18,25,58,.62); --line:rgba(217,164,65,.18);
  --bone:#EDE7DA; --dim:#94A0BE; --gold:#D9A441; --flare:#E4735A; --aqua:#6FBFB0; --violet:#9B8CE0;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif: "Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans: "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  position: relative; isolation: isolate;
  background: var(--void); color: var(--bone);
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  min-height: 100vh; padding: 0 0 104px; overflow-x: hidden;
}
.orb::before {
  content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(120% 70% at 15% -10%, rgba(155,140,224,.20), transparent 60%),
    radial-gradient(90% 55% at 95% 8%, rgba(228,115,90,.13), transparent 62%),
    radial-gradient(80% 50% at 50% 105%, rgba(111,191,176,.10), transparent 60%),
    linear-gradient(#070B1A, #05070F);
}
.orb-wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }

.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.sky i {
  position: absolute; display: block; border-radius: 99px; background: #fff;
  animation: twinkle var(--t) ease-in-out infinite alternate; animation-delay: var(--d);
}
@keyframes twinkle { from { opacity: .12; transform: scale(.7); } to { opacity: .9; transform: scale(1); } }

.orb h1, .orb h2, .orb h3 { font-family: var(--serif); font-weight: 400; margin: 0; letter-spacing: -.015em; }
.orb h1 { font-size: 32px; line-height: 1.08; }
.orb h2 { font-size: 22px; }
.orb h3 { font-size: 17px; }
.eyebrow {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: .24em; color: var(--gold); opacity: .85;
}
.eyebrow.cool { color: var(--dim); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--dim); } .small { font-size: 13px; } .tiny { font-size: 11.5px; }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 16px;
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
  transition: border-color .35s ease, transform .35s ease, box-shadow .35s ease;
}
.card + .card { margin-top: 12px; }
.card:hover { border-color: rgba(217,164,65,.34); }
.card.glow { box-shadow: 0 0 0 1px rgba(228,115,90,.25), 0 12px 40px -18px rgba(228,115,90,.7); }

.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.page { animation: fadeUp .5s cubic-bezier(.22,.7,.3,1) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: fadeUp .55s cubic-bezier(.22,.7,.3,1) both; }
.stagger > *:nth-child(2) { animation-delay: .06s; }
.stagger > *:nth-child(3) { animation-delay: .12s; }
.stagger > *:nth-child(4) { animation-delay: .18s; }
.stagger > *:nth-child(5) { animation-delay: .24s; }

.btn {
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  background: transparent; color: var(--gold); border: 1px solid rgba(217,164,65,.5);
  border-radius: 3px; padding: 9px 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background .25s ease, color .25s ease, border-color .25s ease, transform .18s ease, box-shadow .25s ease;
  flex: 0 0 auto;
}
.btn.wide { width: 100%; justify-content: center; padding: 12px; }
.btn:hover { background: rgba(217,164,65,.14); transform: translateY(-1px); box-shadow: 0 6px 18px -10px rgba(217,164,65,.9); }
.btn:active { transform: translateY(0); }
.btn.solid { background: var(--gold); border-color: var(--gold); color: #10162E; }
.btn.solid:hover { background: #E7B65A; }
.btn.coral { background: var(--flare); border-color: var(--flare); color: #10162E; }
.btn.coral:hover { background: #EE8570; box-shadow: 0 6px 20px -10px rgba(228,115,90,1); }
.btn.sea { background: transparent; border-color: rgba(111,191,176,.55); color: var(--aqua); }
.btn.sea:hover { background: rgba(111,191,176,.14); }
.btn.ghost { border-color: rgba(237,231,218,.22); color: var(--bone); }
.btn.ghost:hover { background: rgba(237,231,218,.08); }
.btn:disabled { opacity: .3; cursor: not-allowed; transform: none; box-shadow: none; }
.icon-btn {
  background: none; border: none; padding: 6px; cursor: pointer; color: var(--dim);
  border-radius: 3px; display: inline-flex; transition: color .2s ease, background .2s ease;
}
.icon-btn:hover { color: var(--flare); background: rgba(228,115,90,.12); }

.orb input, .orb select, .orb textarea {
  font-family: var(--sans); font-size: 14px; color: var(--bone);
  background: rgba(7,11,26,.55); border: 1px solid rgba(237,231,218,.16); border-radius: 3px;
  padding: 8px 10px; width: 100%; min-width: 0; -webkit-appearance: none;
  transition: border-color .25s ease, background .25s ease;
}
.orb input:hover, .orb textarea:hover { border-color: rgba(217,164,65,.35); }
.orb input::placeholder, .orb textarea::placeholder { color: rgba(148,160,190,.65); }
.orb textarea { font-family: var(--serif); font-size: 15px; line-height: 1.55; resize: vertical; }
.orb input:focus-visible, .orb textarea:focus-visible, .orb button:focus-visible, .orb [tabindex]:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 2px;
}
.orb input.mini { padding: 6px 8px; font-family: var(--mono); font-size: 13px; }

.bar { height: 5px; background: rgba(237,231,218,.1); border-radius: 99px; overflow: hidden; position: relative; }
.bar > span {
  display: block; height: 100%; border-radius: 99px; position: relative;
  background: linear-gradient(90deg, rgba(111,191,176,.5), var(--aqua));
  transition: width .8s cubic-bezier(.22,.7,.3,1);
}
.bar.amber > span { background: linear-gradient(90deg, rgba(217,164,65,.45), var(--gold)); }
.bar.coral > span { background: linear-gradient(90deg, rgba(228,115,90,.45), var(--flare)); }
.bar > span::after {
  content: ""; position: absolute; inset: 0; border-radius: 99px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  transform: translateX(-100%); animation: shimmer 3.4s ease-in-out infinite;
}
@keyframes shimmer { 0%,55% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: linear-gradient(rgba(7,11,26,.72), rgba(7,11,26,.96));
  border-top: 1px solid rgba(217,164,65,.2);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; justify-content: flex-start; gap: 2px; padding: 8px 10px 12px;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; min-width: 66px; }
.tab {
  background: none; border: none; cursor: pointer; color: var(--dim);
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 6px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  transition: color .25s ease, transform .25s ease;
}
.tab:hover { color: var(--bone); }
.tab.on { color: var(--gold); transform: translateY(-2px); }
.tab .dot { width: 3px; height: 3px; border-radius: 99px; background: transparent; transition: background .3s ease, box-shadow .3s ease; }
.tab.on .dot { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  border: 1px solid rgba(237,231,218,.2); border-radius: 99px; padding: 5px 11px; color: var(--dim);
  background: transparent; cursor: pointer; transition: all .25s ease;
}
.chip:hover { border-color: rgba(217,164,65,.5); color: var(--bone); }
.chip.on { background: rgba(217,164,65,.16); color: var(--gold); border-color: rgba(217,164,65,.6); }

.grid-books { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 460px) { .grid-books { grid-template-columns: repeat(2, 1fr); } }
.cover {
  aspect-ratio: 2/3; width: 100%; border: 1px solid rgba(237,231,218,.14); border-radius: 3px;
  overflow: hidden; cursor: pointer; position: relative; display: flex; align-items: flex-end; padding: 10px;
  background: linear-gradient(160deg, #1B2450, #0B1029 70%);
  transition: transform .35s cubic-bezier(.22,.7,.3,1), box-shadow .35s ease, border-color .35s ease;
}
.cover:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: 0 18px 34px -20px rgba(0,0,0,.95); border-color: rgba(217,164,65,.45); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover span { font-family: var(--serif); font-size: 13px; line-height: 1.2; z-index: 1; text-shadow: 0 1px 6px rgba(0,0,0,.9); }

.sheet {
  position: fixed; inset: 0; z-index: 60; background: rgba(4,7,16,.72);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .3s ease both; backdrop-filter: blur(3px);
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.sheet-inner {
  background: linear-gradient(#0F1533, #0A0F26); width: 100%; max-width: 760px; max-height: 92vh;
  overflow-y: auto; border-radius: 8px 8px 0 0; padding: 18px 16px 44px;
  border-top: 1px solid rgba(217,164,65,.45); box-shadow: 0 -20px 60px -30px rgba(217,164,65,.6);
  animation: slideUp .42s cubic-bezier(.22,.7,.3,1) both;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: .4 } to { transform: none; opacity: 1 } }

.stars-row { display: inline-flex; gap: 4px; }
.star { cursor: pointer; color: rgba(237,231,218,.28); transition: transform .2s ease, color .2s ease; }
.star:hover { transform: scale(1.18) rotate(6deg); }
.star.on { color: var(--gold); filter: drop-shadow(0 0 5px rgba(217,164,65,.7)); }

.quote { font-family: var(--serif); font-size: 15px; line-height: 1.5; border-left: 2px solid var(--gold); padding-left: 10px; }

.tick {
  width: 19px; height: 19px; border: 1px solid rgba(237,231,218,.3); border-radius: 99px;
  flex: 0 0 auto; margin-top: 2px; background: rgba(7,11,26,.5);
  display: flex; align-items: center; justify-content: center; color: transparent;
  transition: all .3s cubic-bezier(.22,.7,.3,1);
}
.tick.on { background: var(--aqua); border-color: var(--aqua); color: #08121A; box-shadow: 0 0 14px -2px rgba(111,191,176,.85); }
.line-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(237,231,218,.08); }
.line-item:last-child { border-bottom: none; }
.hit { background: none; border: none; cursor: pointer; text-align: left; flex: 1; padding: 0; color: inherit; display: flex; gap: 10px; align-items: flex-start; }

.hold { border: 1px solid rgba(217,164,65,.5); background: rgba(217,164,65,.08); border-radius: 5px; padding: 14px; }
.craft { transition: transform .9s cubic-bezier(.22,.7,.3,1); }
.pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
@keyframes pulse { 0%,100% { opacity: .35; r: 13 } 50% { opacity: .1; r: 20 } }
.spin { animation: spin 90s linear infinite; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg) } }
.drift { animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translateY(0) } to { transform: translateY(-7px) } }
.toast {
  position: fixed; left: 50%; bottom: 96px; z-index: 70; transform: translateX(-50%);
  background: linear-gradient(#182146,#0D1230); color: var(--bone);
  border: 1px solid rgba(217,164,65,.55); box-shadow: 0 10px 40px -14px rgba(217,164,65,.8);
  padding: 10px 16px; border-radius: 99px; font-family: var(--mono); font-size: 12px;
  animation: toastIn .4s cubic-bezier(.22,.7,.3,1) both;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 18px) } to { opacity: 1; transform: translate(-50%, 0) } }

.pill {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 99px; border: 1px solid currentColor; opacity: .9;
}
.thumb {
  width: 62px; height: 62px; border-radius: 4px; object-fit: cover; flex: 0 0 auto;
  border: 1px solid rgba(237,231,218,.16); background: linear-gradient(160deg,#1B2450,#0B1029);
}
.swatch { width: 26px; height: 26px; border-radius: 99px; border: 1px solid rgba(237,231,218,.25); cursor: pointer; transition: transform .2s ease; }
.swatch:hover { transform: scale(1.12); }
.swatch.on { box-shadow: 0 0 0 2px var(--void), 0 0 0 3px currentColor; }
.wk { display: flex; gap: 5px; }
.wk button {
  flex: 1; aspect-ratio: 1; border-radius: 99px; border: 1px solid rgba(237,231,218,.2);
  background: transparent; color: var(--dim); font-family: var(--mono); font-size: 11px; cursor: pointer;
  transition: all .25s ease;
}
.wk button.on { background: rgba(217,164,65,.2); border-color: var(--gold); color: var(--gold); box-shadow: 0 0 12px -4px var(--gold); }
.onboard { max-width: 480px; margin: 0 auto; padding: 40px 18px 60px; }

@media (prefers-reduced-motion: reduce) {
  .orb *, .orb *::before, .orb *::after { animation: none !important; transition: none !important; }
}
